<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FANO-1 // desk reset</title>
<link rel="stylesheet" href="assets/dossier.css">
<style>
  .dossier{max-width:40rem;margin:4rem auto}
  .stamp{border:2px solid var(--stamp,#b33);color:var(--stamp,#b33);
        display:inline-block;padding:.4rem 1rem;transform:rotate(-3deg);
        font-weight:700;letter-spacing:.1em}
  a{color:#7fd4ff}
  #votebox{display:none;margin:1rem 0}
  #votebox textarea{width:100%;min-height:8rem;font-family:monospace}
  button{padding:.5rem 1rem;background:#0d141b;color:#cfe3f4;
        border:1px solid #2a3a48;border-radius:4px;cursor:pointer}
</style>
</head>
<body>
<div class="dossier">
  <div class="stamp">DESK RESET — ADMIRALTY DOCTRINE</div>
  <h1 id="title">Inspecting the desk…</h1>
  <div id="verdict"></div>
  <div id="votebox">
    <p>This desk holds the <strong>flag founding</strong> on a foreign
       origin. The Fleet Admiral's credentials burn only under a
       <strong>unanimous Admiralty vote</strong> — paste a
       FANO-RESET-v1 token signed by every genesis member:</p>
    <textarea id="token" placeholder='{"body":{...},"sigs":{...}}'></textarea>
    <p><button id="vote-btn">VERIFY VOTE &amp; BURN</button></p>
  </div>
  <pre id="log"></pre>
  <p><a href="index.html">→ proceed to the covenant</a></p>
</div>
<script src="assets/fano-reset.js"></script>
<script>
var t = document.getElementById("title"), v = document.getElementById("verdict"),
    log = document.getElementById("log");
var CANON = "127.0.0.1";
var hop = new URLSearchParams(location.search).get("hop");

/* scorched earth: every key on this origin burns, not just the desk's */
function scorch() {
  var had = Object.keys(localStorage);
  try { sessionStorage.clear(); } catch (e) {}
  localStorage.clear();
  return had;
}

/* after this origin is ash, sweep the sibling loopback store once,
   then land on the canonical covenant */
function next() {
  if (hop) { location.replace("http://" + CANON + ":" + location.port + "/index.html"); return; }
  var twin = location.hostname === CANON ? "localhost" : CANON;
  location.replace("http://" + twin + ":" + location.port + "/reset.html?hop=1");
}

function census() {
  /* read-only readout — what this desk ACTUALLY holds, before the burn.
     Answers "why won't my credential work": whose keystore is wrapped here,
     who founded it, and whether the fail counter is cooling. */
  var rows = ["HOST  " + location.host, ""];
  try {
    var rec = JSON.parse(localStorage.getItem("fano1.identity") || "null");
    if (rec) {
      rows.push("RECORD " + (rec.user || "?") + "  ·  " +
        ((rec.cert && rec.cert.role) || "?") +
        "  ·  enrolled " + (rec.created || "?"));
      rows.push("KEY    pk " + String(rec.pk || "").slice(0, 24) + "…" +
        "  ·  covenant " + String(rec.covenant_sha256 || "").slice(0, 16) + "…");
    } else rows.push("RECORD (none — no keystore on this origin)");
    var gen = JSON.parse(localStorage.getItem("fano1.genesis") || "null");
    rows.push(gen
      ? "GENESIS founded by " + (gen.callsign || "?") +
        "  ·  pk_sha256 " + String(gen.pk_sha256 || "").slice(0, 16) + "…"
      : "GENESIS (none — desk unfounded)");
    var iss = JSON.parse(localStorage.getItem("fano1.issuers") || "[]");
    rows.push("ISSUERS " + iss.length + " rostered");
    var f = JSON.parse(localStorage.getItem("fano1.auth.fail") || "null");
    var cool = f && f.until > Date.now() ? Math.ceil((f.until - Date.now()) / 1000) : 0;
    rows.push("FAILS  " + (f ? f.n : 0) + " misses" +
      (cool ? "  ·  COOLING " + cool + "s — unlock is refused while hot" : ""));
    rows.push("LIVES  " + (localStorage.getItem("fano1.lives") || "0") +
      " enrollments on this desk");
  } catch (e) { rows.push("census error: " + e.message); }
  return rows;
}

function burn(tag) {
  var seen = census();
  var had = scorch();
  t.textContent = "Desk razed — " + tag;
  log.textContent = seen.join("\n") + "\n\n" + (had.length
    ? had.map(function (k) { return "destroyed  " + k; }).join("\n")
    : "store already empty") +
    "\n\nsweeping the twin origin, then returning to the covenant…";
  setTimeout(next, 2600);
}

FANO_RESET.guard().then(function (g) {
  if (g.mode === "vote" && !hop) {
    t.textContent = "Flag desk — vote required";
    v.innerHTML = "<p>Founding callsign <code>" + (g.callsign || "?") +
      "</code> is the Fleet Admiral's seat. A unanimous vote of the " +
      "Admiralty is required to burn it on this origin.</p>";
    document.getElementById("votebox").style.display = "block";
    return;
  }
  burn(g.mode === "cluster" ? "sovereign cluster, unilateral"
       : hop ? "twin origin swept" : "ordinary desk");
});
document.getElementById("vote-btn").addEventListener("click", function () {
  FANO_RESET.verifyVote(document.getElementById("token").value).then(function (ok) {
    if (ok) burn("unanimous vote verified");
    else { t.textContent = "Vote refused"; v.innerHTML =
      "<p>The token did not carry every genesis member's valid signature.</p>"; }
  });
});
</script>
</body>
</html>
